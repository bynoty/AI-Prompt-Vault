<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="description" content="AI Prompt Vault - Self-Hosted Workspace with Auto-Sync & Offline PWA support" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/manifest.json" />
    <title>AI Prompt Vault</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => console.log('SW reg failed: ', err));
        });
      }
    </script>
    <script>
      (function() {
        try {
          var activeFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return activeFetch; },
            set: function(v) { activeFetch = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Failed to patch window.fetch:", e);
        }
        try {
          var activeFetch = globalThis.fetch;
          Object.defineProperty(globalThis, 'fetch', {
            get: function() { return activeFetch; },
            set: function(v) { activeFetch = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Failed to patch globalThis.fetch:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
